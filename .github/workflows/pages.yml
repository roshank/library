# Publishes the app to GitHub Pages on every push to main.
# The site is static with no build step, so the job just checks every recipe
# still builds, copies the shipped files, and deploys them.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every recipe builds
        run: npm run check
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html styles.css sw.js manifest.webmanifest icons src _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
